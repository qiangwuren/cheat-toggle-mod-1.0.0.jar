# ============================================================================
#  Gradle 运行参数 —— 多线程 + 并行下载，面向国内网络优化
# ============================================================================
# 构建内存：2G 足够；机器内存紧张可下调为 -Xmx1536M
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
# 多线程构建
org.gradle.parallel=true
# 并行下载依赖构件
org.gradle.parallel.download=true
# 配置缓存：大幅加速二次构建
org.gradle.configuration-cache=true
# 缓存依赖与构建产物
org.gradle.caching=true
# 文件系统监听：受限沙箱下原生监视器会报 "Couldn't open current thread, error = 5"，
# 且首次构建并无收益，故关闭。
org.gradle.vfs.watch=false
# 依赖下载失败自动重试
org.gradle.internal.repository.max.retries=5
org.gradle.internal.repository.initial.backoff=500

# ============================================================================
#  Fabric / Minecraft 版本
#  26.3 起 Minecraft 已「无混淆」：无需 mappings，也无需 Yarn（Yarn 止步 1.21.11）
# ============================================================================
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2
fabric_api_version=0.161.0+26.3

# Loom 通过国内镜像解析 Minecraft 版本清单（BMCLAPI，实测可直连），
# 避免每次构建都去 piston-meta.mojang.com 慢速拉取。
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
loom_experimental_versions=https://maven.fabricmc.net/net/minecraft/experimental_versions.json

# ============================================================================
#  Mod 元信息
# ============================================================================
mod_version=1.0.1
maven_group=com.cheattoggle
archives_base_name=cheat-toggle-mod

# ============================================================================
#  Java 版本 —— 已按要求放宽，取「可用范围内的最低值」
#
#  为什么下限是 25（而不是更低的 17/21）：
#   1) Minecraft 26.3 的 client.jar 全部 class 文件版本为 69 = Java 25，
#      javac 无法为 Java 25 字节码产出 release < 25 的编译结果；
#   2) Mojang 版本清单声明游戏运行时为 java-runtime-epsilon / majorVersion 25；
#   3) fabric-loom 1.18.2 自身字节码为 Java 25（org.gradle.jvm.version=25）。
#  因此取 25：JDK 25、26、27… 均可，**不再强制最新版 JDK**。
# ============================================================================
java_release=25
java_version_min=25
